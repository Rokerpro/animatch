version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: animatch_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./animatch.db
      - CORS_ORIGINS=["http://localhost:5173"]
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ./backend/animatch.db:/app/animatch.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: animatch_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
